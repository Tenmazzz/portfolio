<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    ::selection { background: #a8461e; color: #f6f3ee; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
</helmet>

<div ref="{{rootRef}}" style="background:{{c.bg}};color:{{c.body}};min-height:100vh;font-family:'IBM Plex Sans',sans-serif;transition:background 0.3s,color 0.3s;">

  <nav style="position:fixed;top:0;left:0;right:0;z-index:100;background:{{c.bg}};border-bottom:1px solid {{c.border}};padding:1.1rem 2rem;transition:background 0.3s,border-color 0.3s;">
    <div style="max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;">
      <a href="Portfolio.dc.html" style="color:{{c.body}};text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;letter-spacing:0.04em;" style-hover="color:{{c.accent}};">← {{backLabel}}</a>
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <button onClick="{{toggleLang}}" style="background:none;border:1px solid {{c.border}};color:{{c.body}};font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.05em;padding:0.35rem 0.6rem;cursor:pointer;" style-hover="border-color:{{c.accent}};color:{{c.high}};">{{langLabel}}</button>
        <button onClick="{{toggleTheme}}" style="background:none;border:1px solid {{c.border}};color:{{c.body}};font-family:'IBM Plex Mono',monospace;font-size:0.72rem;letter-spacing:0.05em;padding:0.35rem 0.6rem;cursor:pointer;" style-hover="border-color:{{c.accent}};color:{{c.high}};">{{themeLabel}}</button>
      </div>
    </div>
  </nav>

  <div style="max-width:760px;margin:0 auto;padding:7.5rem 2rem 2rem;">
    <h1 style="font-family:'Newsreader',serif;font-style:italic;font-weight:500;font-size:clamp(2.4rem,7vw,4rem);line-height:1.05;color:{{c.high}};margin:0 0 1.25rem;">{{title}}<span style="color:{{c.accent}};">.</span></h1>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:0.82rem;color:{{c.low}};line-height:1.9;">{{stackStr}}</div>
  </div>

  <div style="height:1px;background:{{c.border}};max-width:760px;margin:2rem auto;"></div>

  <div style="max-width:760px;margin:0 auto;padding:0 2rem 3rem;">
    <h2 style="font-family:'Newsreader',serif;font-size:clamp(1.4rem,3vw,1.8rem);color:{{c.high}};margin:0 0 1rem;font-weight:500;">{{contextTitle}}</h2>
    <p style="font-size:1rem;line-height:1.85;color:{{c.body}};margin:0;">{{contextText}}</p>
  </div>

  <div style="height:1px;background:{{c.border}};max-width:760px;margin:0 auto;"></div>

  <div style="max-width:760px;margin:0 auto;padding:3rem 2rem;">
    <h2 style="font-family:'Newsreader',serif;font-size:clamp(1.4rem,3vw,1.8rem);color:{{c.high}};margin:0 0 1rem;font-weight:500;">{{howTitle}}</h2>
    <p style="font-size:1rem;line-height:1.85;color:{{c.body}};margin:0;">{{howText}}</p>
  </div>

  <div style="max-width:760px;margin:0 auto;padding:0 2rem 5rem;display:flex;flex-direction:column;gap:1.5rem;">
    <div style="border:1px solid {{c.border}};overflow:hidden;">
      <img src="projects/new_projet_vol_home.png" style="width:100%;display:block;">
    </div>
    <div style="border:1px solid {{c.border}};overflow:hidden;">
      <img src="projects/new_projet_vol_auth_admin.png" style="width:100%;display:block;">
    </div>
    <div style="border:1px solid {{c.border}};overflow:hidden;">
      <img src="projects/new_projet_vol_admin.png" style="width:100%;display:block;">
    </div>
  </div>

  <footer style="text-align:center;padding:2.5rem;color:{{c.low}};font-family:'IBM Plex Mono',monospace;font-size:0.75rem;border-top:1px solid {{c.border}};">
    Rayan · 2026
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { dark: true, lang: 'fr' };

  renderVals() {
    const lang = this.state.lang;
    const dark = this.state.dark;
    const c = dark ? {
      bg: '#15140f', surface: '#1b1a14', high: '#f3f0e8', body: '#b6b1a4', low: '#726d60', border: '#2b2a22',
      accent: 'oklch(0.72 0.13 55)'
    } : {
      bg: '#f6f3ee', surface: '#efeae1', high: '#1c1a16', body: '#54514a', low: '#8b8678', border: '#dedad0',
      accent: 'oklch(0.53 0.15 45)'
    };

    const stack = ['Laravel', 'Sqlite', 'Bootstrap'];

    return {
      c, rootRef: () => {},
      title: lang === 'fr' ? "Billetterie d'avion" : 'Flight Booking',
      langLabel: lang === 'fr' ? 'EN' : 'FR',
      themeLabel: dark ? (lang === 'fr' ? 'Clair' : 'Light') : (lang === 'fr' ? 'Sombre' : 'Dark'),
      toggleLang: () => this.setState({ lang: lang === 'fr' ? 'en' : 'fr' }),
      toggleTheme: () => this.setState({ dark: !dark }),
      backLabel: lang === 'fr' ? 'Retour au portfolio' : 'Back to portfolio',
      stackStr: stack.join('   ·   '),
      contextTitle: lang === 'fr' ? 'Pourquoi ce projet ?' : 'Why this project?',
      contextText: lang === 'fr'
        ? "Pour ma deuxième année de licence, dans le cadre du projet de fin d'année, il a été demandé de simuler un site de billetterie de billets d'avion. Ce projet était à réaliser en binôme, pour commencer à répartir le travail et nous initier au travail de groupe."
        : 'For the second year of my degree, as an end-of-year project, we were asked to simulate a flight ticket booking website. This project was done in pairs, to start distributing work and get us introduced to group work.',
      howTitle: lang === 'fr' ? 'Comment ça fonctionne ?' : 'How does it work?',
      howText: lang === 'fr'
        ? "Le site propose un système de filtres pour rechercher les vols qui conviennent. Une fois le ou les vols ajoutés, on passe au panier qui mène vers une page d'inscription. Une partie admin permet aussi au personnel de garder un œil sur les passagers, et d'ajouter, modifier ou supprimer des vols."
        : 'The site offers a filter system to search for suitable flights. Once one or more flights are added, you move to the cart, which leads to a registration page. An admin panel also lets staff keep an eye on passengers, and add, edit, or delete flights.'
    };
  }
}

</script>
</body>
</html>
